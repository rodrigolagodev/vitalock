name: supabase-checks

on:
  pull_request:

concurrency:
  group: supabase-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required status checks must report on every PR. Filtering happens here
  # instead of on the trigger: a job skipped by `if:` still reports Success,
  # while a workflow skipped by `paths:` never reports and leaves the PR stuck
  # on an "expected" check (observed on DB-only PRs, 2026-09-11).
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - 'packages/supabase/**'
              - 'packages/config-eslint/**'
              - 'packages/config-typescript/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/supabase-checks.yml'

  supabase-checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @vitalock/supabase lint

      - name: Typecheck
        run: pnpm --filter @vitalock/supabase typecheck

      - name: Test
        run: pnpm --filter @vitalock/supabase test
