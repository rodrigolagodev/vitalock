name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build admin
        env:
          VITE_BASE_PATH: /vitalock/admin/
        run: pnpm --filter @vitalock/admin build

      - name: Build installer
        env:
          VITE_BASE_PATH: /vitalock/installer/
        run: pnpm --filter @vitalock/installer build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/admin _site/installer
          cp -r apps/admin/dist/. _site/admin/
          cp -r apps/installer/dist/. _site/installer/
          # SPA fallback for client-side routing on GitHub Pages
          cp _site/admin/index.html _site/admin/404.html
          cp _site/installer/index.html _site/installer/404.html
          cp .github/pages/index.html _site/index.html
          cp .github/pages/404.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
