name: installer-checks

on:
  pull_request:

concurrency:
  group: installer-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Required status checks must report on every PR. Filtering happens here
  # instead of on the trigger: a job skipped by `if:` still reports Success,
  # while a workflow skipped by `paths:` never reports and leaves the PR stuck
  # on an "expected" check (observed on DB-only PRs, 2026-09-11).
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            installer:
              - 'apps/installer/**'
              - 'packages/ui/**'
              - 'packages/shared/**'
              - 'packages/supabase/**'
              - 'packages/config-eslint/**'
              - 'packages/config-typescript/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.github/workflows/installer-checks.yml'

  installer-checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local Turborepo cache persisted through the GitHub Actions cache. No
      # Vercel remote cache / TURBO_TOKEN required.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-installer-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-installer-

      # `@vitalock/installer...` means installer AND its workspace
      # dependencies (@vitalock/ui, @vitalock/shared, @vitalock/supabase).
      - name: Lint, typecheck and test
        run: pnpm exec turbo run lint typecheck test --filter=@vitalock/installer... --cache-dir=.turbo/cache
