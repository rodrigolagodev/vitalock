<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitalock — Demo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 640px; text-align: center; }
      h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
      p.lead { color: #94a3b8; margin: 0 0 2.5rem; font-size: 1.05rem; line-height: 1.6; }
      .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      @media (max-width: 520px) { .apps { grid-template-columns: 1fr; } }
      a.app {
        display: block;
        padding: 1.5rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }
      a.app:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); transform: translateY(-2px); }
      a.app h2 { margin: 0 0 0.4rem; font-size: 1.25rem; }
      a.app span { color: #94a3b8; font-size: 0.9rem; }
      footer { margin-top: 2.5rem; color: #64748b; font-size: 0.85rem; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vitalock</h1>
      <p class="lead">Sistema de gestión y operaciones en campo. Elegí una app para ingresar.</p>
      <div class="apps">
        <a class="app" href="./admin/">
          <h2>Admin</h2>
          <span>Panel de administración</span>
        </a>
        <a class="app" href="./installer/">
          <h2>Installer</h2>
          <span>App del instalador (PWA)</span>
        </a>
      </div>
      <footer>
        <a href="https://github.com/rodrigolagodev/vitalock">Ver código en GitHub</a>
      </footer>
    </main>
  </body>
</html>
